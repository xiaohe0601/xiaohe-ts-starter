ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - docs
  - playground
  - packages/**
  - examples/**

catalogs:
  build:
    "@vitejs/plugin-vue": ^6.0.8
    tsdown: ^0.22.14
    vite: ^8.2.0
  cli:
    "@antfu/ni": ^30.3.0
    bumpp: ^12.1.1
    pncat: ^0.13.0
  frontend:
    "@vue/runtime-core": ^3.5.40
    vue: ^3.5.40
  lint:
    eslint: ^10.8.0
    lint-staged: ^17.3.0
    simple-git-hooks: ^2.13.1
  script:
    esno: ^4.8.0
  style:
    ress: ^5.0.2
  test:
    vitest: ^4.1.10
  tsc:
    typescript: ~6.0.3
    vue-tsc: ~3.3.9
  types:
    "@types/node": ^24.13.3
  xiaohe:
    "@xiaohe01/catalog-rules": ^0.0.4
    "@xiaohe01/eslint-config": ^7.2.0
    "@xiaohe01/tsconfig": ^3.1.0

allowBuilds:
  esbuild: true
  simple-git-hooks: true