ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - docs
  - playground
  - packages/**
  - examples/**

catalogs:
  build:
    "@vitejs/plugin-vue": ^6.0.7
    tsdown: ^0.22.1
    vite: ^8.0.16
  cli:
    "@antfu/ni": ^30.1.0
    bumpp: ^11.1.0
    pncat: ^0.12.0
  frontend:
    "@vue/runtime-core": ^3.5.35
    vue: ^3.5.35
  lint:
    eslint: ^10.4.1
    lint-staged: ^17.0.7
    simple-git-hooks: ^2.13.1
  script:
    esno: ^4.8.0
  style:
    ress: ^5.0.2
  test:
    vitest: ^4.1.8
  tsc:
    typescript: ~6.0.3
    vue-tsc: ~3.3.3
  types:
    "@types/node": ^24.12.4
  xiaohe:
    "@xiaohe01/catalog-rules": ^0.0.4
    "@xiaohe01/eslint-config": ^7.0.0
    "@xiaohe01/tsconfig": ^3.1.0

allowBuilds:
  esbuild: true
  simple-git-hooks: true